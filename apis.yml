aid: airnow
name: Airnow
description: >-
  Airnow is a London-headquartered group of specialist mobile-app technology companies operating as
  one engine for app-first businesses: Lab Cave (Madrid, mobile game publishing and growth), AppMonsta
  (UK, programmatic ad-tech and an app-store intelligence dataset), Mobstr (UK, AI-driven mobile-app
  security scanning and GRC ratings) and Vambrace (UK, managed SOC and vCISO services). The group is
  fusing these into Project Chimera, a unified SaaS platform announced for 2026 that layers AI
  analytics, media buying and monetisation on a 24-million-app data lake. Airnow itself publishes no
  developer program, API reference or machine-readable contract; the API surface in the group sits
  with its subsidiary AppMonsta. Pre-IPO shares trade on EquityZen.
